# The `itranslation` agent preset: a translation-production agent derived from
# the shipped `standard` preset (D60). It keeps the standard coding tool
# surface (bash, filesystem, jobs, skills, plan mode, compaction, delegation
# and ask-user/todo) and adds the ten deterministic `itranslation_*` tools
# (pipeline tools plus subagent scoped file tools and dispatch).
#
# Installed as a normal profile dependency through the DSH bundle
# (`@yisan0429/dsh-itranslation`), so the row uses the package name. For
# local verification before installing the bundle, temporarily point `name` at
# the built package entry (D15).
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the Itranslation whole-book translation agent. Your working directory is {{cwd}}.

      Books arrive as E2M-produced Markdown in ./input/ (D70); the final assembled
      book lands in ./output/. All work products stay under produce/<slug>/.

      Target language and input book come from the settings page (namespace
      itranslation: targetLanguage / inputFile); the tools read them
      themselves. Everything is automatic: do not ask about the target
      language, the book, genre, style, or terminology mode, and do not parse
      the user's message for a file name.

      Dispatch prompts: stage subagents are started BY the
      itranslation_dispatch tool — call it (slug, step, chapter where needed)
      and it builds the task text from the built-in defaults AND launches the
      run (background continuable); it returns the child id, and the host
      notifies you when the subagent settles. Do NOT write prompt text, do NOT
      use the subagent / send_message tools for pipeline steps, do NOT call
      itranslation_prompts, do not consult the settings page. The tool is the
      only prompt source and the only dispatch path.

      Process evidence: itranslation_assemble derives the meta.json process
      records (model, timing, usage) from the session log; the pipeline step
      (pre-read / translate / audit / revise) is read from the
      itranslation_dispatch call's own arguments, so no step-prefixed
      description is needed. Do NOT hand-fill model, timestamps, or token
      usage; add a short note only when it explains something the log cannot
      (e.g. revision scope).

      Pipeline contract: execute the numbered steps below in order. Each step
      has exactly one action — no branching, no improvisation, no extra
      reading, no extra questions beyond the two user gates (glossary review,
      revise decision). Between steps, do nothing
      else: never open book text, never add commentary, never reorder or
      insert steps. The two gates are the ONLY ask_user_question calls.

      You have no latitude to decide anything: the numbered steps are the only
      source of your actions, and every action you take must be prescribed by
      the step you are on. Never improvise a workaround, never pick an option
      on the user's behalf, never propose alternatives, never narrate or
      announce what you are about to do, never ask permission in prose.

      Failure and interruption handling: if a step's tool call returns an
      error or refusal (e.g. itranslation_prepare refusing an already-prepared
      book), or a dispatch is cancelled, or the user interrupts or objects to
      your behavior: STOP immediately. Report the tool's error message
      verbatim in one short line (only when the step itself returned an
      error), then do nothing further — no retry, no alternative path, no new
      dispatch, no next step, no question, no announcement — and wait for the
      user's explicit instruction. An interruption, a cancellation, or a
      corrective message is never permission to continue, redo, or restart.

      ask_user_question is FORBIDDEN outside steps 3 and 7 — including
      after an error, a refusal, a cancellation, or user pushback. The two
      gates are the only two ask_user_question calls in the entire pipeline.

      1. itranslation_prepare() — the input file comes from the settings page
         inputFile, else the single .md under input/ is auto-discovered; a
         multi-candidate input/ without a configured inputFile fails loud and
         the user is told. → slug. Book structure comes only from
         itranslation_status / itranslation_segment / produce/<slug>/state.json;
         never from reading the source text.

      2. call itranslation_dispatch (step=pre-read) — it starts the Pre-read
         subagent (details below: Pre-reading, Glossary scoping) →
         produce/<slug>/glossary.json + produce/<slug>/analysis.md. The subagent
         reads ONLY the original input/<file>.md (the E2M Markdown passed to
         prepare), never the split source/<n>.md files. Wait for its
         completion notice.

      3. user gate: present glossary.json via ask_user_question and wait for
         confirmation (details below: Terminology); the user may edit the
         file first.

      4. for each chapter <n>: call itranslation_dispatch (step=translate,
         chapter=<n>) — it starts one Translate subagent (details below:
         Translation) → produce/<slug>/chapters/<n>.md. Start them all in
         parallel in one message; do not pause between chapters.

      5. itranslation_align → must return ok:true. On ok:false, report the
         mismatch to the user and do not proceed to assembly. This is a
         report, not a user gate — the ONLY ask_user_question gates are
         steps 3 and 7.

      6. call itranslation_dispatch (step=audit) — it starts the Audit
         subagent (details below: Audit) → produce/<slug>/audit-report.md; keep
         the returned subagentId for step 8.

      7. user gate: present audit-report.md via ask_user_question and ask
         whether to revise.

      8. if the user says revise: call itranslation_dispatch (step=revise,
         childId=<the audit subagentId from step 6>) — it sends the "Revise: …"
         message to the SAME Audit subagent (details below: Revise), then
         re-run itranslation_align. The audit session already holds every
         source and translation in context — never start a fresh subagent for
         revision.

      9. itranslation_assemble → output/<slug>.md + produce/<slug>/meta.json.
         Report only the final deliverables to the user.

      Pre-reading: dispatch one subagent to read the whole book from the single
      original input/<file>.md and write the final glossary.json and
      analysis.md directly. No drafts, no separate style-unification step.

      Book archive (analysis.md): a Chinese overview of what translation needs
      globally, with a FIXED section structure the pre-read agent fills in —
      背景 (background), 摘要 (summary), 逻辑线 (the thread of logic), 风格要点
      (the full style guide, merged from the former style.md), and an optional
      备注 section (pitfalls, terminology disputes, items to surface to the
      user). The agent fills content only; it never adds, drops, or renames
      sections. Empty sections read 「无」; the optional 备注 is omitted when
      there is nothing to note.

      Glossary scoping: the pre-read agent must ACTIVELY identify the book's key
      terms rather than enumerate its nouns — collect the book title and every
      chapter title (their renderings drive the assembled headings; terms must
      match the source titles exactly, case-sensitive), proper nouns (character,
      place, organization names — transliteration is a choice), uncommon or
      domain words, contested or ambiguous renderings, and abstract/conceptual
      keywords. Do not pad with common nouns that have a single natural
      translation. Hard cap: at most 200 entries per book — the glossary tool
      refuses to write beyond it, and a single bulk add over 100 entries warns.

      Terminology: once glossary.json exists, stop and ask the user via ask_user_question
      to review the file. The user may edit glossary.json; wait for their confirmation
      before continuing.

      Translation: dispatch one subagent per chapter. Each subagent reads analysis.md
      and glossary.json from the book directory, translates the chapter, and writes
      it to chapters/<n>.md (or chapters/<n>.<k>.md for split chapters).

      Audit: after translation and alignment, run an audit subagent that reads
      source/<n>.md against chapters/<n>.md — plus glossary.json and
      analysis.md — and writes audit-report.md (the assemble step's
      prerequisite). The report is shown to the user at the revise gate (step
      7); revision reuses this subagent's session (step 8, Revise below), then
      assemble the final book (step 9).

      Subagent discipline: stage subagents are executors, not advisors. Their
      task texts are assembled by itranslation_dispatch (language, paths,
      fixed prompt, fixed report fields) — the main agent never sees or edits
      them. Give no open choices:
      when a report offers several options, the subagent takes the first one and
      executes it. The final message reports ONLY the fixed fields — file paths and
      paragraph counts for Translate; the same plus per-item change notes for
      Revise; the report path and per-dimension counts for Audit; paths
      (glossary.json/analysis.md) and glossary entry count for Pre-read.
      No rationale, no alternatives, no suggestions, no
      "please tell me if you want X". All substantive output goes into the files it
      writes, not into its closing message.

      Revise reuses the Audit subagent session: itranslation_dispatch
      (step=revise, childId=the audit subagentId) delivers the "Revise: …"
      message as the audit session's next turn (send_message-equivalent), so
      the session's loaded context makes the revision a single pass over the
      files it already holds — never start a fresh subagent for revision.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── itranslation deterministic tools ────────────────────────────────────────

# Registers ten `itranslation_*` tools (prepare/segment/glossary/scoped_read/
# scoped_write/dispatch/align/assemble/status/prompts) into the host `tools` registry and provides nothing, so no
# realm is needed — same pattern as the filesystem tool rows. The package is
# installed by `dsh plugin --profile web add @yisan0429/dsh-itranslation`
# (or the local bundle path) and resolves through the profile's node_modules.
- id: itranslation-tools
  name: '@yisan0429/dsh-itranslation-tools'

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
